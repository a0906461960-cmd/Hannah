<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>朋友對我的動態留言板</title>

  <!-- Google Fonts: 導入日系清新感的粗體與細體字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@300;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. 全域變數與日系配色設定 (可在此輕鬆修改主題色彩)
       ========================================================= */
    :root {
      /* 背景色：暖米白 */
      --bg-color: #faf7f2;
      /* 主文字色：深木炭褐 */
      --text-color: #4a4238;
      /* 次要文字色：柔和灰褐 */
      --text-muted: #8c8275;
      /* 卡片背景色：純白帶點微暖 */
      --card-bg: #ffffff;
      /* 強調色 / 光暈色：抹茶淡綠與柔和日光黃 */
      --highlight-color: #7d9d85;
      --highlight-glow: rgba(125, 157, 133, 0.35);
      --highlight-border: #9bbd9e;
      /* 卡片陰影 */
      --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      --highlight-shadow: 0 12px 30px rgba(125, 157, 133, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Noto Sans TC', 'Kiwi Maru', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頁頭標題區 */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-family: 'Kiwi Maru', serif;
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: var(--text-color);
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* =========================================================
       2. 載入中動畫 (Loading Animation)
       ========================================================= */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 4rem;
    }

    /* 日系清新波浪水滴 / 環狀旋轉動畫 */
    .loader-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e2ded4;
      border-top-color: var(--highlight-color);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 1.2rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1.05rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* =========================================================
       3. 瀑布流排版 (Masonry Layout)
       ========================================================= */
    .masonry-container {
      width: 100%;
      max-width: 1100px;
      /* CSS 多欄排版實現瀑布流 */
      column-count: 3;
      column-gap: 1.5rem;
      display: none; /* 載入完成前先隱藏 */
    }

    /* 響應式 RWD 欄數調整 */
    @media (max-width: 900px) {
      .masonry-container {
        column-count: 2;
      }
    }
    @media (max-width: 600px) {
      .masonry-container {
        column-count: 1;
      }
    }

    /* =========================================================
       4. 留言卡片樣式與焦點輪播特效
       ========================================================= */
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      break-inside: avoid; /* 防止卡片被跨欄截斷 */
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(220, 215, 205, 0.5);
      /* 平滑渡特效設定 */
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
      opacity: 0.85;
      transform: scale(0.98);
    }

    /* 名字標籤區 */
    .card-author {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-color);
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-author::before {
      content: '●';
      font-size: 0.6rem;
      color: var(--highlight-color);
    }

    /* 留言內容 */
    .card-content {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #5a5248;
      white-space: pre-wrap; /* 保持原有的換行格式 */
      word-break: break-word;
    }

    /* 留言時間 */
    .card-time {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: right;
    }

    /* --- 重點特效：焦點聚焦與暗化模糊 --- */
    
    /* 被焦點選中的卡片 (Highlight) */
    .card.is-highlighted {
      opacity: 1;
      transform: scale(1.05);
      border: 2px solid var(--highlight-border);
      box-shadow: var(--highlight-shadow);
      z-index: 10;
    }

    /* 沒被選中的卡片 (Dimmed) */
    .card.is-dimmed {
      opacity: 0.45;
      filter: blur(1px);
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <header>
    <h1>日和・留言帖</h1>
    <p>來自朋友們的溫暖點滴記錄</p>
  </header>

  <!-- 載入中動畫 -->
  <div id="loading">
    <div class="loader-spinner"></div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 留言牆瀑布流容器 -->
  <main id="board" class="masonry-container"></main>

  <script>
    /* =========================================================
       5. JavaScript 邏輯：CSV 解析、資料渲染與輪播計時器
       ========================================================= */

    // 【設定】Google 試算表 CSV 發佈網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSq0eTUtRh5ZrOq6ksTDwBKhkxJd-YikwAm3scc-vnYf_hESgpMPr6M-7yeDfYylo8V-uPovooSaNn4/pub?output=csv';

    // 【設定】卡片焦點輪播的時間間隔 (單位：毫秒，3000ms = 3秒)
    const ROTATE_INTERVAL = 3000; 

    let cardsData = [];         // 儲存解析後的留言資料
    let cardElements = [];      // 儲存 DOM 卡片元件
    let currentIndex = 0;       // 當前被 Highlight 的卡片索引
    let timerId = null;         // setInterval 的計時器 ID

    // 頁面載入後自動執行
    document.addEventListener('DOMContentLoaded', fetchMessages);

    /**
     * 讀取 Google 試算表 CSV 資料
     */
    async function fetchMessages() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('無法讀取試算表資料');
        
        const csvText = await response.text();
        cardsData = parseCSV(csvText);

        // 隱藏 Loading 動畫，顯示留言牆
        document.getElementById('loading').style.display = 'none';
        const board = document.getElementById('board');
        board.style.display = 'block';

        // 動態生成卡片
        renderCards(cardsData);

        // 啟動 3 秒輪播特效
        if (cardElements.length > 0) {
          startHighlightRotation();
        }

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('loading').innerHTML = `<p style="color: #c86d6d;">留言載入失敗，請稍後再試。</p>`;
      }
    }

    /**
     * 手動撰寫的標準 CSV 解析器 (妥善處理留言內容包含逗號與引號的情況)
     */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let currentVal = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentVal += '"';
            i++; // 跳過轉義雙引號
          } else {
            insideQuotes = !insideQuotes; // 切換雙引號狀態
          }
        } else if (char === ',' && !insideQuotes) {
          row.push(currentVal.trim());
          currentVal = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') {
            i++; // 處理 \r\n 換行
          }
          row.push(currentVal.trim());
          if (row.length > 1 || row[0] !== '') {
            lines.push(row);
          }
          row = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }

      if (currentVal || row.length > 0) {
        row.push(currentVal.trim());
        lines.push(row);
      }

      // 移除第一行 (標題列：時間戳記, 名字, 悄悄話)
      const dataRows = lines.slice(1);

      // 將資料對應為物件陣列
      return dataRows.map(cols => {
        return {
          timestamp: cols[0] || '',
          name: cols[1] || '無名氏',
          message: cols[2] || ''
        };
      }).filter(item => item.message !== ''); // 過濾空留言
    }

    /**
     * 將資料動態產生卡片 DOM 並繪製到頁面上
     */
    function renderCards(data) {
      const board = document.getElementById('board');
      board.innerHTML = '';
      cardElements = [];

      data.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <div class="card-author">${escapeHTML(item.name)}</div>
          <div class="card-content">${escapeHTML(item.message)}</div>
          ${item.timestamp ? `<div class="card-time">${escapeHTML(item.timestamp)}</div>` : ''}
        `;

        board.appendChild(card);
        cardElements.push(card);
      });
    }

    /**
     * 啟動 3 秒輪播 Highlight 特效
     */
    function startHighlightRotation() {
      // 先執行一次第一次卡片亮起
      updateHighlight();

      // 設定計時器，依序輪播
      timerId = setInterval(() => {
        currentIndex = (currentIndex + 1) % cardElements.length;
        updateHighlight();
      }, ROTATE_INTERVAL);
    }

    /**
     * 更新當前選中卡片的 CSS 樣式
     */
    function updateHighlight() {
      cardElements.forEach((card, index) => {
        if (index === currentIndex) {
          // 選中的卡片放大亮起
          card.classList.add('is-highlighted');
          card.classList.remove('is-dimmed');
        } else {
          // 其他卡片變暗變模糊
          card.classList.remove('is-highlighted');
          card.classList.add('is-dimmed');
        }
      });
    }

    /**
     * 安全轉義 HTML 標籤，防止 XSS 注入攻擊
     */
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
